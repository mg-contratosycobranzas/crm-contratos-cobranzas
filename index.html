<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#214e75">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<title>CRM Contratos y Cobranzas · Grupo MG</title>
<meta name="description" content="Seguimiento de expedientes por etapas, usuarios y clientes.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f6f6a'/%3E%3Ctext x='16' y='21' font-size='14' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3EMG%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">MG</div><div><b>Contratos y Cobranzas</b><span>Grupo MG · Seguimiento</span></div></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="scrim" data-act="nav-toggle" aria-hidden="true"></div>
  <div class="main">
    <header class="top">
      <button class="btn menu-btn" data-act="nav-toggle" aria-label="Menú">☰</button>
      <span class="tbrand">GRUPO MG</span><label for="gproy">Proyecto</label><select id="gproy"></select>
      <div class="grow"></div>
      <label for="actor">Trabajando como</label><select id="actor"></select>
      <button class="btn sm xl" data-act="export-xlsx" title="Descargar procesos e indicadores en Excel"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg><span>Descargar Excel</span></button>
      <button class="btn sm" id="logoutBtn" data-act="logout" hidden title="Cerrar sesión">Salir</button>
      <button class="btn sm icon" data-act="help" aria-label="Ayuda" title="Ayuda"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17v.5"/></svg></button>
      <button class="btn sm icon" id="themeBtn" data-act="theme" aria-label="Cambiar entre modo día y noche" title="Modo día / noche">
        <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>
    <div id="banner"></div>
    <main class="page" id="view"></main>
  </div>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<div id="gate" hidden></div>
<div id="dls"></div>
<input type="file" id="evfile" accept="application/pdf,.pdf" hidden>
<input type="file" id="minfile" accept="application/pdf,.pdf" hidden>
<button class="fab" id="fab" data-act="fab" aria-label="Acción rápida" title="Acción rápida">+</button>
<nav class="tabbar" id="tabbar" aria-label="Navegación principal"></nav>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/cloud.js"></script>
<script src="data/operaciones.js"></script>
<script src="js/model.js"></script>
<script src="js/evolta.js"></script>
<script src="js/clausula.js"></script>
<script src="js/constancia.js"></script>
<script src="js/app.js"></script>
</body>
</html>
